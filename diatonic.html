<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Diatonic Table - tsuzuura.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --muted-color: #636e72;
            --accent-color: #0984e3;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 48px 16px 40px;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.5;
        }
        .page-wrap {
            width: 100%;
            max-width: 920px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
            text-align: center;
            line-height: 1.2;
        }
        h1 a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        h1 a:hover {
            opacity: 0.7;
        }
        .page-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--muted-color);
            text-align: center;
            margin: 0 0 22px;
            letter-spacing: 0.01em;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .controls label {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .controls select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .controls select:hover,
        .controls select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.12);
        }
        .table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            min-width: 720px;
        }
        col.scale-col {
            width: 16%;
        }
        col.degree-col {
            width: 12%;
        }
        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding: 12px 6px;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
        }
        th:last-child, td:last-child {
            border-right: none;
        }
        tbody tr:last-child th,
        tbody tr:last-child td {
            border-bottom: none;
        }
        thead th {
            background-color: #f1f3f5;
            font-weight: 700;
            font-size: 0.95rem;
        }
        tbody th {
            background-color: #fafbfc;
            font-weight: 700;
            text-align: left;
            padding-left: 14px;
            padding-right: 10px;
            font-size: 0.9rem;
        }
        tbody td {
            font-size: 0.95rem;
            font-weight: 600;
        }
        sub, sup {
            font-size: 0.72em;
            line-height: 0;
            position: relative;
            vertical-align: baseline;
        }
        sup {
            top: -0.5em;
        }
        sub {
            bottom: -0.22em;
        }

        /* スマホ幅（480px以下）で index.html と h1 位置・サイズを揃える */
        @media (max-width: 480px) {
            body {
                padding: 32px 16px 28px;
            }
            h1 {
                font-size: 1.8rem;
                margin: 0 0 10px;
            }
            .page-title {
                font-size: 0.95rem;
                margin: 0 0 18px;
            }
        }

        /* スマホ横向きでは横スクロールなしで収まりやすく調整 */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 12px 12px;
            }
            h1 {
                font-size: 1.4rem;
                margin: 0 0 4px;
            }
            .page-title {
                font-size: 0.85rem;
                margin: 0 0 10px;
            }
            .controls {
                margin-bottom: 12px;
            }
            table {
                min-width: 0;
            }
            th, td {
                padding: 6px 2px;
                font-size: 0.76rem;
            }
            tbody th {
                padding-left: 6px;
                padding-right: 6px;
                font-size: 0.74rem;
            }
        }

        /* 狭めの横幅でも表がコンパクトに収まるよう調整 */
        @media (max-width: 720px) and (orientation: landscape) {
            table {
                min-width: 0;
            }
            th, td {
                padding: 7px 2px;
                font-size: 0.78rem;
            }
            tbody th {
                padding-left: 6px;
                padding-right: 6px;
                font-size: 0.76rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <h1><a href="index.html">tsuzuura.com</a></h1>
        <h2 class="page-title">Unified Diatonic Table</h2>

        <div class="controls">
            <label for="key-select">Key:</label>
            <select id="key-select" aria-label="Select Key">
                <option value="—" selected>—</option>
                <option value="C">C</option>
                <option value="F">F</option>
                <option value="B♭">B♭</option>
                <option value="E♭">E♭</option>
                <option value="A♭">A♭</option>
                <option value="D♭">D♭</option>
                <option value="G♭">G♭</option>
                <option value="F♯">F♯</option>
                <option value="B">B</option>
                <option value="E">E</option>
                <option value="A">A</option>
                <option value="D">D</option>
                <option value="G">G</option>
            </select>
        </div>

        <div class="table-scroll">
            <table>
                <colgroup>
                    <col class="scale-col">
                    <col class="degree-col">
                    <col class="degree-col">
                    <col class="degree-col">
                    <col class="degree-col">
                    <col class="degree-col">
                    <col class="degree-col">
                    <col class="degree-col">
                </colgroup>
                <thead>
                    <tr>
                        <th>Scale</th>
                        <th>Ⅰ</th>
                        <th>Ⅱ</th>
                        <th>Ⅲ</th>
                        <th>Ⅳ</th>
                        <th>Ⅴ</th>
                        <th>Ⅵ</th>
                        <th>Ⅶ</th>
                    </tr>
                </thead>
                <tbody id="diatonic-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const DEGREES = ["Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ", "Ⅴ", "Ⅵ", "Ⅶ"];
        const MAJOR_DEGREE_SEMITONES = [0, 2, 4, 5, 7, 9, 11];
        const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];

        // ピッチ（0〜11）に対して使用可能な異名同音表記
        const PITCH_SPELLINGS = {
            0:  ["C", "B♯", "D♭♭"],
            1:  ["C♯", "D♭"],
            2:  ["D", "C♯♯", "E♭♭"],
            3:  ["E♭", "D♯", "F♭♭"],
            4:  ["E", "F♭", "D♯♯"],
            5:  ["F", "E♯", "G♭♭"],
            6:  ["F♯", "G♭"],
            7:  ["G", "F♯♯", "A♭♭"],
            8:  ["A♭", "G♯"],
            9:  ["A", "G♯♯", "B♭♭"],
            10: ["B♭", "A♯", "C♭♭"],
            11: ["B", "C♭", "A♯♯"]
        };

        const KEY_ROOT_PITCH = {
            "C": 0,
            "F": 5,
            "B♭": 10,
            "E♭": 3,
            "A♭": 8,
            "D♭": 1,
            "G♭": 6,
            "F♯": 6,
            "B": 11,
            "E": 4,
            "A": 9,
            "D": 2,
            "G": 7
        };

        const KEY_START_LETTER = {
            "C": "C",
            "F": "F",
            "B♭": "B",
            "E♭": "E",
            "A♭": "A",
            "D♭": "D",
            "G♭": "G",
            "F♯": "F",
            "B": "B",
            "E": "E",
            "A": "A",
            "D": "D",
            "G": "G"
        };

        const PREFER_FLAT_KEYS = new Set(["F", "B♭", "E♭", "A♭", "D♭", "G♭"]);

        const SCALES = [
            {
                name: "Major",
                intervals: [0, 2, 4, 5, 7, 9, 11],
                qualities: ["maj7", "m7", "m7", "maj7", "7", "m7", "m7b5"]
            },
            {
                name: "Melodic Minor",
                intervals: [0, 2, 3, 5, 7, 9, 11],
                qualities: ["mmaj7", "m7", "augmaj7", "7", "7", "m7b5", "m7b5"]
            },
            {
                name: "Harmonic Minor",
                intervals: [0, 2, 3, 5, 7, 8, 11],
                qualities: ["mmaj7", "m7b5", "augmaj7", "m7", "7", "maj7", "dim7"]
            },
            {
                name: "Natural Minor",
                intervals: [0, 2, 3, 5, 7, 8, 10],
                qualities: ["m7", "m7b5", "maj7", "m7", "m7", "maj7", "7"]
            }
        ];

        function formatChord(rootLabel, quality) {
            switch (quality) {
                case "maj7":
                    return `${rootLabel}<sub>△7</sub>`;
                case "m7":
                    return `${rootLabel}<sub>m7</sub>`;
                case "7":
                    return `${rootLabel}<sub>7</sub>`;
                case "m7b5":
                    return `${rootLabel}<sub>m7</sub><sup>(♭5)</sup>`;
                case "mmaj7":
                    return `${rootLabel}<sub>m△7</sub>`;
                case "augmaj7":
                    return `${rootLabel}<sub>aug△7</sub>`;
                case "dim7":
                    return `${rootLabel}<sub>dim7</sub>`;
                default:
                    return `${rootLabel}`;
            }
        }

        function getKeylessDegreeLabel(degreeIndex, scaleInterval) {
            const baseDegree = DEGREES[degreeIndex];
            const majorSemitone = MAJOR_DEGREE_SEMITONES[degreeIndex];
            const diff = (scaleInterval - majorSemitone + 12) % 12;

            if (diff === 11) {
                return `♭${baseDegree}`;
            }
            return baseDegree;
        }

        function spellScaleNotes(selectedKey, intervals) {
            const tonicPitch = KEY_ROOT_PITCH[selectedKey];
            const startLetterIndex = LETTERS.indexOf(KEY_START_LETTER[selectedKey]);
            const preferFlat = PREFER_FLAT_KEYS.has(selectedKey);

            // 1スケール内で各音名（A〜G）が重複しないよう、Ⅰ〜Ⅶに順番に文字名を割り当てる
            return intervals.map((interval, idx) => {
                const pitch = (tonicPitch + interval) % 12;
                const targetLetter = LETTERS[(startLetterIndex + idx) % 7];
                const candidates = PITCH_SPELLINGS[pitch];

                // 1. 期待する音名（targetLetter）で始まる表記を最優先
                const matchingLetter = candidates.filter((name) => name.startsWith(targetLetter));
                if (matchingLetter.length > 0) {
                    const preferred = matchingLetter.find((name) =>
                        preferFlat ? name.includes("♭") : !name.includes("♭")
                    );
                    return preferred || matchingLetter[0];
                }

                // 2. 見つからない場合はキーの♭/♯傾向に合う表記をフォールバック
                const fallback = candidates.find((name) =>
                    preferFlat ? name.includes("♭") : !name.includes("♭")
                );
                return fallback || candidates[0];
            });
        }

        function renderTable(selectedKey) {
            const tbody = document.getElementById("diatonic-tbody");
            tbody.innerHTML = "";

            const isKeyless = selectedKey === "—";

            SCALES.forEach((scale) => {
                const tr = document.createElement("tr");

                const th = document.createElement("th");
                th.textContent = scale.name;
                tr.appendChild(th);

                const spelledNotes = isKeyless ? null : spellScaleNotes(selectedKey, scale.intervals);

                scale.intervals.forEach((interval, idx) => {
                    const td = document.createElement("td");
                    if (isKeyless) {
                        const degreeLabel = getKeylessDegreeLabel(idx, interval);
                        td.innerHTML = formatChord(degreeLabel, scale.qualities[idx]);
                    } else {
                        td.innerHTML = formatChord(spelledNotes[idx], scale.qualities[idx]);
                    }
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });
        }

        const keySelect = document.getElementById("key-select");
        keySelect.addEventListener("change", (e) => {
            renderTable(e.target.value);
        });

        renderTable(keySelect.value);
    </script>
</body>
</html>
