    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --accent-color: #0984e3;
            --card-bg: #ffffff;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 48px 16px 40px;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.5;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Title styles */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 28px;
            letter-spacing: -0.02em;
            color: var(--text-color);
            line-height: 1.2;
        }
        h1 a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        h1 a:hover {
            opacity: 0.7;
        }

        .links { display: grid; gap: 16px; }
        .link-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: all 0.2s ease;
            min-height: 56px;
            line-height: 1.4;
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Brand icon colors */
        .link-card i,
        .custom-icon {
            font-size: 1.1rem;
            width: 28px;
            margin-right: 12px;
            text-align: center;
        }

        .fa-linkedin { color: #0077b5; }
        .fa-github { color: #24292e; }
        .fa-facebook { color: #1877f2; }
        .fa-music { color: #0984e3; }
        .wantedly-icon { color: #00a4bb; font-style: normal; font-weight: bold; }

        /* Custom LIG icon styles */
        .lig-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            line-height: 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 900;
            margin-right: 12px;
            font-family: 'Inter', sans-serif;
        }

        /* Keep link arrows smaller than the text */
        .link-card-arrow {
            margin-left: auto;
            padding-left: 12px;
            width: auto;
            flex: 0 0 auto;
            font-size: 0.75rem;
            color: #b0b5ba;
        }

        /* Responsive styles */
        @media (max-width: 480px) {
            body {
                padding: 32px 16px 28px;
            }

            .container {
                max-width: 360px;
            }

            h1 {
                margin: 0 0 24px;
                font-size: 1.8rem;
            }

            .links {
                gap: 12px;
            }

            .link-card {
                min-height: 52px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<div class="container">
