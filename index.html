<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tsuzuura.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --accent-color: #0984e3;
            --card-bg: #ffffff;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }
        
        /* Title styles */
        h1 { 
            font-size: 2.2rem; 
            font-weight: 800;
            margin-bottom: 30px; 
            letter-spacing: -0.02em;
            color: var(--text-color);
        }

        .links { display: grid; gap: 16px; }
        .link-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: all 0.2s ease;
            min-height: 56px;
            line-height: 1.4;
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Brand icon colors */
        .link-card i,
        .custom-icon {
            font-size: 1.1rem;
            width: 28px;
            margin-right: 12px;
            text-align: center;
        }
        
        /* Brand icon colors */
        .fa-linkedin { color: #0077b5; }
        .fa-github { color: #24292e; }
        .fa-facebook { color: #1877f2; }
        .wantedly-icon { color: #00a4bb; font-style: normal; font-weight: bold; }

        /* Custom LIG icon styles */
        .lig-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            line-height: 20px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 900;
            margin-right: 12px;
            font-family: 'Inter', sans-serif;
        }

        /* Keep external-link arrows smaller than the text */
        .link-card-arrow {
            margin-left: auto;
            padding-left: 12px;
            width: auto;
            flex: 0 0 auto;
            font-size: 0.75rem;
            color: #b0b5ba;
        }

        /* Responsive styles */
        @media (max-width: 480px) {
            .container {
                max-width: 360px;
                padding: 24px 16px;
            }

            h1 {
                margin-bottom: 24px;
                font-size: 1.8rem;
            }

            .links {
                gap: 12px;
            }

            .link-card {
                min-height: 52px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>tsuzuura.com</h1>
    
    <div class="links">
        <a href="https://www.facebook.com/tsuzuura/" class="link-card" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook" aria-hidden="true"></i>
            <span>Facebook</span>
            <i class="fas fa-arrow-up-right-from-square link-card-arrow" aria-hidden="true"></i>
        </a>

        <a href="https://www.linkedin.com/in/ryosuke-tsuzuura-076583229?trk=public_profile_browsemap&originalSubdomain=jp" class="link-card" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-linkedin" aria-hidden="true"></i>
            <span>LinkedIn</span>
            <i class="fas fa-arrow-up-right-from-square link-card-arrow" aria-hidden="true"></i>
        </a>
        
        <a href="https://sg.wantedly.com/id/ryosuke_tsuzuura" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="wantedly-icon custom-icon">W</span>
            <span>Wantedly</span>
            <i class="fas fa-arrow-up-right-from-square link-card-arrow" aria-hidden="true"></i>
        </a>
        
        <a href="https://github.com/tsuzuura-jp" class="link-card" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-github" aria-hidden="true"></i>
            <span>GitHub</span>
            <i class="fas fa-arrow-up-right-from-square link-card-arrow" aria-hidden="true"></i>
        </a>     
        
        <a href="https://liginc.co.jp/author/tsuzuura_ryosuke" class="link-card" target="_blank" rel="noopener noreferrer">
            <span class="lig-icon">L</span>
            <span>LIG Blog (Past Work)</span>
            <i class="fas fa-arrow-up-right-from-square link-card-arrow" aria-hidden="true"></i>
        </a>
    </div>
</div>

</body>
</html>
