name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          rm -rf _site
          mkdir -p _site
          for item in *; do
            if [ "$item" != "_site" ] && [ "$item" != "CNAME" ]; then
              cp -R "$item" "_site/"
            fi
          done

      - name: Deploy main to root
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: .
          keep_files: true
          cname: tsuzuura.com

      - name: Deploy beta to /beta
        if: github.ref_name == 'beta'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: beta
          keep_files: true
          cname: tsuzuura.com