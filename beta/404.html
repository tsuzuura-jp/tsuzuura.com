<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - tsuzuura.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K29VJTTKLK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K29VJTTKLK');
    </script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --muted-color: #636e72;
            --accent-color: #0984e3;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 48px 16px 40px;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 28px;
            letter-spacing: -0.02em;
            color: var(--text-color);
            line-height: 1.2;
        }
        h1 a {
            color: inherit;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }
        h1 a:hover {
            opacity: 0.7;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 24px;
        }
        .error-code {
            display: inline-block;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--muted-color);
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .error-title {
            margin: 0 0 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.35;
        }
        .error-description {
            margin: 0 0 24px;
            font-size: 0.92rem;
            color: var(--muted-color);
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 20px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-color);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-home .btn-arrow {
            color: #b0b5ba;
            font-size: 0.85rem;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        .btn-home:hover .btn-arrow {
            color: var(--accent-color);
            transform: translateX(-2px);
        }
        @media (max-width: 480px) {
            body {
                padding: 32px 16px 28px;
            }
            h1 {
                margin: 0 0 24px;
                font-size: 1.8rem;
            }
            .card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1><a href="/">tsuzuura.com</a></h1>

        <section class="card" aria-labelledby="error-heading">
            <span class="error-code">404</span>
            <h2 id="error-heading" class="error-title">Page not found</h2>
            <p class="error-description">
                The page you are looking for might have been moved, removed, or never existed.
            </p>
            <a href="/" class="btn-home">
                <span class="btn-arrow" aria-hidden="true">&larr;</span>
                <span>Back to Home</span>
            </a>
        </section>
    </main>
    <script src="/beta-badge.js" defer></script>
</body>
</html>
